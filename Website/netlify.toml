# Netlify configuration — AssetFlow Website
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Deploy: Netlify Dashboard → Add new site → Import an existing project.
# Set the VITE_API_URL environment variable (below or in the dashboard) to the
# Render backend URL, e.g. https://assetflow-api.onrender.com/api/v1

[build]
  base = "Website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Point this at your Render service URL after the first backend deploy:
  VITE_API_URL = "https://assetflow-api.onrender.com/api/v1"

# SPA fallback — send every route to index.html so client-side routing works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-lived caching for hashed build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
