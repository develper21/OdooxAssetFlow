# Netlify configuration — AssetFlow Website
# Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
#
# Deploy: Netlify Dashboard → Add new site → Import an existing project.
#
# IMPORTANT: set VITE_API_URL in the Netlify UI only
# (Site configuration → Environment variables), pointing at your Render
# backend service, e.g. https://<your-render-service>.onrender.com/api/v1
# Do NOT hardcode the real URL in this file — Netlify's secrets scanner
# fails the build when a secret env var's value appears in repo files.

[build]
  base = "Website"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # VITE_* variables are compiled into the public JS bundle, so they are not
  # secrets. Omitting VITE_API_URL from secrets scanning prevents false
  # positives (e.g. the same URL appearing in .env.example) from failing
  # the build.
  SECRETS_SCAN_OMIT_KEYS = "VITE_API_URL"

# SPA fallback — send every route to index.html so client-side routing works
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-lived caching for hashed build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
